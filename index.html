<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Login Demo</title></head>
<body>
  <input id="email" placeholder="email" value="prasad@techbench.in">
  <input id="password" type="password" placeholder="password" value="o136o5pnVJwLk4Db7ykm6T">
  <button id="loginBtn">Log in</button>
  <pre id="out"></pre>

  <script>
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const out = document.getElementById('out');
      out.textContent = 'sending...';
      try {
        const res = await fetch('https://techbench.in/apigateway/login/', {  // <-- 1. URL
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
            // 'Authorization': 'Bearer <token>'   // <-- only if needed
          },
          credentials: 'same-origin',   // <-- 3. 'include' for cross-origin cookies
          body: JSON.stringify({         // <-- 2. body
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        out.textContent = `status: ${res.status}\n\n` + JSON.stringify(data, null, 2);
      } catch (err) {
        out.textContent = 'error: ' + err.message;
      }
    });
  </script>
</body>
</html>
