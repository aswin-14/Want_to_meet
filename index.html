<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Timesheets Demo</title></head>
<body>
  <button id="loadBtn">GET /api/timesheets/</button>
  <pre id="out"></pre>

  <script>
    document.getElementById('loadBtn').addEventListener('click', async () => {
      const out = document.getElementById('out');
      out.textContent = 'sending...';
      try {
        const res = await fetch('https://techbench.in/api/timesheets/', {
          method: 'GET',
          // 'include' asks the browser to attach cookies cross-origin.
          // BUT: the auth cookies are SameSite=Lax, so the browser will
          // silently drop them on this cross-site fetch. Nothing you can
          // do from JS changes that.
          credentials: 'include',
          headers: {
            'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'
          }
        });

        const text = await res.text();
        let data; try { data = JSON.parse(text); } catch { data = text; }
        out.textContent = `status: ${res.status}\n\n` +
          (typeof data === 'string' ? data : JSON.stringify(data, null, 2));
      } catch (err) {
        out.textContent = 'error: ' + err.message;
      }
    });
  </script>
</body>
</html>
