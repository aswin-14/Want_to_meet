<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Login Demo</title></head>
<body>
  <input id="email" placeholder="email" value="prasad@techbench.in">
  <input id="password" type="password" placeholder="password" value="o136o5pnVJwLk4Db7ykm6T">
  <button id="loginBtn">Log in</button>
  <pre id="out"></pre>

  <script>
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const out = document.getElementById('out');
      out.textContent = 'sending...';
      try {
        const res = await fetch('https://techbench.in/apigateway/login/', {
          method: 'POST',
          // Use a "simple" content type to avoid triggering CORS preflight (OPTIONS).
          // 'text/plain' is on the CORS-safelisted list, so the browser sends POST directly.
          // Server still receives a JSON string in the body.
          headers: {
            'Content-Type': 'text/plain;charset=UTF-8',
            'Accept': 'application/json'
          },
          credentials: 'include',   // send cookies cross-origin
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        const text = await res.text();
        let data;
        try { data = JSON.parse(text); } catch { data = text; }
        out.textContent = `status: ${res.status}\n\n` + (typeof data === 'string' ? data : JSON.stringify(data, null, 2));
      } catch (err) {
        out.textContent = 'error: ' + err.message;
      }
    });
  </script>
</body>
</html>
