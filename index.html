<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Login Demo</title></head>
<body>
  <input id="email" value="prasad@techbench.in">
  <input id="password" type="password" value="o136o5pnVJwLk4Db7ykm6T">
  <button id="loginBtn">Log in</button>
  <pre id="out"></pre>

  <script>
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const out = document.getElementById('out');
      out.textContent = 'sending...';
      try {
        // Only safelisted headers. Content-Type: text/plain is safelisted.
        // No Accept customization needed (browser default is */*).
        const res = await fetch('https://techbench.in/apigateway/login/', {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
          // NOTE: no credentials:'include' the first time — that itself
          // can force stricter CORS handling. Add it only if you truly need cookies.
        });

        const text = await res.text();
        let data; try { data = JSON.parse(text); } catch { data = text; }
        out.textContent = `status: ${res.status}\n\n` +
          (typeof data === 'string' ? data : JSON.stringify(data, null, 2));
      } catch (err) {
        out.textContent = 'error: ' + err.message;
      }
    });
  </script>
</body>
</html>
