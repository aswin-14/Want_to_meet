<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Verify Email Demo</title></head>
<body>
  <label>Token:</label><br>
  <input id="token" size="90"
         value="eyJ1c2VyX2lkIjoxNjgsInB1cnBvc2UiOiJ2ZXJpZnlfZW1haWwifQ:1x4e8s:_mGQROMk_1Hpf4obBIP2rmTn7LknPDE4MVFZGWTdnJc">
  <br><br>
  <button id="verifyBtn">Verify Email (fetch)</button>
  <button id="navBtn">Verify Email (navigate)</button>
  <pre id="out"></pre>

  <script>
    function buildUrl() {
      // Build the URL with the RAW token value. No encodeURIComponent,
      // no URLSearchParams, no decoding. Exactly what you typed.
      const raw = document.getElementById('token').value;
      return 'https://techbench.in/apigateway/verify-email?token=' + raw;
    }

    // ---- Option 1: fetch() — cross-origin, no CORS headers on server, will be blocked ----
    document.getElementById('verifyBtn').addEventListener('click', async () => {
      const out = document.getElementById('out');
      const url = buildUrl();
      out.textContent = 'URL:\n' + url + '\n\nsending...';
      try {
        const res = await fetch(url, {
          method: 'GET',
          headers: {
            'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'
          }
          // No credentials, no custom headers — simple request, no preflight.
        });
        const text = await res.text();
        let data; try { data = JSON.parse(text); } catch { data = text; }
        out.textContent = 'URL:\n' + url + '\n\nstatus: ' + res.status + '\n\n' +
          (typeof data === 'string' ? data : JSON.stringify(data, null, 2));
      } catch (err) {
        out.textContent = 'URL:\n' + url + '\n\nerror: ' + err.message;
      }
    });

    // ---- Option 2: top-level navigation — this is what actually reproduces the captured request ----
    document.getElementById('navBtn').addEventListener('click', () => {
      const url = buildUrl();
      // Navigation is NOT subject to CORS. Cookies with SameSite=Lax ARE sent.
      window.location.href = url;
    });
  </script>
</body>
</html>
