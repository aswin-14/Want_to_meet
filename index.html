<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Timesheets Attempt</title></head>
<body>
  <h3>Attempt: get /api/timesheets/ from aswin-14.github.io with techbench.in cookies</h3>
  <button id="try1">1. fetch with credentials:'include'</button>
  <button id="try2">2. try to set Cookie header manually</button>
  <button id="try3">3. copy cookies via document.cookie</button>
  <button id="try4">4. fetch with Authorization Bearer (manual token)</button>
  <button id="try5">5. iframe the endpoint</button>
  <pre id="out" style="white-space:pre-wrap; font-size:13px;"></pre>

  <script>
    const out = document.getElementById('out');
    const URL = 'https://techbench.in/api/timesheets/';
    const log = (s) => { out.textContent += s + '\n\n'; };
    const clear = () => { out.textContent = ''; };

    // -------- Attempt 1: the standard, correct attempt --------
    document.getElementById('try1').addEventListener('click', async () => {
      clear();
      log('--- Attempt 1: fetch with credentials:"include" ---');
      try {
        const res = await fetch(URL, {
          method: 'GET',
          credentials: 'include',  // ask browser to attach cookies
          headers: { 'Accept': 'application/json' }
        });
        log('status: ' + res.status);
        log(await res.text());
      } catch (err) {
        log('ERROR: ' + err.message);
        log('(This is the expected outcome — CORS blocked the read, ' +
            'and/or no cookies were attached.)');
      }
      log('→ Open DevTools > Network > the request. Check:\n' +
          '  - Is there a "Cookie:" header? (Almost certainly: no.)\n' +
          '  - Is there "Access-Control-Allow-Origin" in the response? (No.)');
    });

    // -------- Attempt 2: try to forge the Cookie header --------
    document.getElementById('try2').addEventListener('click', async () => {
      clear();
      log('--- Attempt 2: set Cookie header manually ---');
      try {
        const res = await fetch(URL, {
          method: 'GET',
          headers: {
            'Accept': 'application/json',
            // Try to forge the cookie. This is a forbidden header name.
            'Cookie': 'access_token=FAKE; role=superadmin; sub_role=admin'
          }
        });
        log('status: ' + res.status);
        log(await res.text());
      } catch (err) {
        log('ERROR: ' + err.message);
      }
      log('→ DevTools > Network > Request Headers. ' +
          'You will NOT see "Cookie:". The browser deleted it ' +
          'before sending. This is enforced by the Fetch spec.');
    });

    // -------- Attempt 3: read techbench.in's cookies via document.cookie --------
    document.getElementById('try3').addEventListener('click', () => {
      clear();
      log('--- Attempt 3: read techbench.in cookies from this origin ---');
      log('document.cookie on aswin-14.github.io returns:');
      log('  "' + (document.cookie || '(empty)') + '"');
      log('→ Any cookies you see here belong to aswin-14.github.io.');
      log('  The techbench.in cookies (access_token, cf_clearance, ' +
          'device_id, role) are NOT visible — they are scoped to a ' +
          'different domain, and access_token/device_id are HttpOnly ' +
          'on top of that.');
      log('  You cannot read another domain\'s cookies. Period.');
    });

    // -------- Attempt 4: manually supply a bearer token --------
    document.getElementById('try4').addEventListener('click', async () => {
      clear();
      log('--- Attempt 4: Authorization: Bearer <token> ---');
      log('Enter a token value below (or paste the one from a login response):');
      const token = prompt('Paste JWT access token (or blank):');
      if (!token) { log('Cancelled.'); return; }
      try {
        const res = await fetch(URL, {
          method: 'GET',
          headers: {
            'Accept': 'application/json',
            'Authorization': 'Bearer ' + token
          }
        });
        log('status: ' + res.status);
        log(await res.text());
      } catch (err) {
        log('ERROR: ' + err.message);
      }
      log('→ "Authorization" is a non-safelisted header, so the browser ' +
          'sent an OPTIONS preflight first. techbench.in does not answer ' +
          'the preflight with Access-Control-Allow-Headers: authorization, ' +
          'so the browser never sent the real GET. CORS error.');
    });

    // -------- Attempt 5: iframe the endpoint --------
    document.getElementById('try5').addEventListener('click', () => {
      clear();
      log('--- Attempt 5: iframe the endpoint ---');
      const f = document.createElement('iframe');
      f.src = URL;
      f.style.width = '100%';
      f.style.height = '300px';
      document.body.appendChild(f);
      log('→ The iframe will load the URL, but:');
      log('  1. Cookies: SameSite=Lax will NOT be sent from a cross-site ' +
          'iframe. The server sees an anonymous request.');
      log('  2. Even if the response loads, your JS CANNOT read inside ' +
          'the iframe — cross-origin iframe DOM access is blocked by ' +
          'the Same-Origin Policy.');
      log('  3. If techbench.in sets X-Frame-Options: DENY (it does — ' +
          'you showed "X-Frame-Options: SAMEORIGIN" in a prior response), ' +
          'the iframe will be refused entirely.');
    });
  </script>
</body>
</html>
